[project]
name = "mllab"
version = "0.1.0"
description = "体験型 機械学習・パターン認識 実践システム"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "streamlit>=1.40",
    "plotly>=5.24",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26,<2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "duckdb>=1.5.5",
    "pyarrow>=25.0.1",
    "httpx>=0.28.1",
    "feedparser>=6.0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mllab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 実通信するテストは既定で除外する（取得元が落ちていても赤くしない）。
# 動かすときは: uv run pytest -m network
addopts = "-m 'not network'"
markers = ["network: 外部 API へ実際に接続するテスト"]
